name: fruzo
description: "Fruzo - Fresh Fruit Cup Shop"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  get: ^4.6.6
  sqflite: ^2.3.3+1
  path: ^1.9.0
  image_picker: ^1.1.2
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  carousel_slider: ^5.0.0
  shimmer: ^3.0.0
  lottie: ^3.1.2
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/lottie/
